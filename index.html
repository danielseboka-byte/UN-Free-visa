<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አስቸኳይ የሰራተኛ ሎኬሽን ማጋሪያ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-red-500/50 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
        <div id="icon-container" class="w-20 h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-bounce">
            🚨
        </div>
        
        <h1 class="text-2xl font-bold mb-2 text-red-400">አስቸኳይ እርዳታ ማግኛ</h1>
        <p id="status-text" class="text-slate-300 text-sm mb-8 leading-relaxed">
            በጫካ ውስጥ አደጋ ሲገጥምዎ ከታች ያለውን ቁልፍ በአንድ ጊዜ በመጫን ሎኬሽንዎን ለአድሚን በሰከንዶች ውስጥ ያጋሩ።
        </p>

        <!-- ሰራተኛው የሚጫነው ብቸኛ ግዙፍ ቁልፍ -->
        <button id="sos-btn" onclick="sendLocation()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition-all text-white font-bold py-4 px-6 rounded-2xl shadow-lg text-lg flex items-center justify-center gap-2 mb-4">
            📍 ሎኬሽን ለአድሚን ላክ
        </button>

        <!-- ሎደር -->
        <div id="loader" class="hidden justify-center items-center mb-4">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent"></div>
            <span class="ml-3 text-slate-300 text-sm">ሎኬሽን በጂፒኤስ በመፈለግ ላይ...</span>
        </div>

        <!-- ስኬታማ መልዕክት -->
        <div id="success-box" class="hidden bg-emerald-950 border border-emerald-500/50 p-4 rounded-xl text-emerald-200 text-sm">
            ✅ <b>ሎኬሽንዎ በተሳካ ሁኔታ ለአድሚን ተጋርቷል!</b> እርዳታ በቅርብ ሰዓት ይደርሶታል።
        </div>
    </div>

    <!-- Firebase SDK እና ሎኬሽን መላኪያ ኮድ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";        
        // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
            apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
            authDomain: "gen-lang-client-0149818830.firebaseapp.com",
            projectId: "gen-lang-client-0149818830",
            storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
            messagingSenderId: "506729355314",
            appId: "1:506729355314:web:d78d0c2c06150b0691442b",
        };
 
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendLocation = function() {
            const sosBtn = document.getElementById("sos-btn");
            const loader = document.getElementById("loader");
            const statusText = document.getElementById("status-text");
            const successBox = document.getElementById("success-box");
            const iconContainer = document.getElementById("icon-container");

            sosBtn.style.display = "none";
            loader.style.display = "flex";
            statusText.innerText = "ስልክዎ ጂፒኤስ (GPS) ሎኬሽን በመቀበል ላይ ነው...";

            if (!navigator.geolocation) {
                alert("ብሮውዘርዎ ሎኬሽን አይደግፍም።");
                loader.style.display = "none";
                sosBtn.style.display = "block";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    try {
                        await addDoc(collection(db, "employee_locations"), {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            timestamp: serverTimestamp(),
                            status: "MANUAL_SOS_CLICKED"
                        });

                        loader.style.display = "none";
                        statusText.style.display = "none";
                        successBox.classList.remove("hidden");
                        iconContainer.innerHTML = "📍";
                        iconContainer.classList.remove("animate-bounce");

                    } catch (error) {
                        console.error("Database Error:", error);
                        loader.style.display = "none";
                        sosBtn.style.display = "block";
                        statusText.innerHTML = "❌ ሎኬሽን መላክ አልተቻለም። እባክዎ እንደገና ይሞክሩ።";
                    }
                },
                (error) => {
                    loader.style.display = "none";
                    sosBtn.style.display = "block";
                    statusText.innerHTML = "⚠️ <b>የሎኬሽን ፈቃድ ተከልክሏል ወይም ጂፒኤስ ጠፍቷል!</b> እባክዎ ጂፒኤስ አብረው ቁልፉን እንደገና ይጫኑ።";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        };
    </script>
</body>
</html>
