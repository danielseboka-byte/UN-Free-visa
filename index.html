<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>ፈጣን የቦታ ማጋሪያ</title>
<style>
  :root{--g:#059669;--r:#dc2626;--y:#d97706;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,"Noto Sans Ethiopic",sans-serif;background:var(--bg);color:var(--ink)}

  /* ===== የግዴታ ማያ (gate) ===== */
  #gate{position:fixed;inset:0;background:var(--g);color:#fff;display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:24px;text-align:center;z-index:999}
  #gate.bad{background:var(--r)}
  #gate h2{font-size:22px;margin:0 0 10px}
  #gate p{font-size:15px;opacity:.95;line-height:1.6;max-width:360px;margin:0 0 26px}
  #gateBtn{width:220px;height:220px;border-radius:50%;border:0;background:#fff;color:var(--g);
           font-size:22px;font-weight:800;box-shadow:0 0 0 0 #ffffff66;cursor:pointer}
  #gateBtn.pulsing{animation:p 1.6s infinite}
  @keyframes p{70%{box-shadow:0 0 0 30px #ffffff00}100%{box-shadow:0 0 0 0 #ffffff00}}
  .help{display:none;text-align:left;background:#fff2;border-radius:12px;padding:14px;font-size:13.5px;
        line-height:1.7;margin-top:18px;max-width:360px}
  .help b{display:block;margin-bottom:4px}
  #retryBtn{margin-top:16px;padding:12px 22px;border:0;border-radius:12px;background:#fff;color:var(--r);
            font-weight:800;font-size:15px}
  #inappBox{display:none;background:#fff2;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.7;max-width:360px;margin-top:10px}
  #inappBox a{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:10px;background:#fff;color:var(--r);font-weight:800;text-decoration:none}

  /* ===== ዋና ገጽ ===== */
  #app{display:none;min-height:100%;flex-direction:column;align-items:center;padding:20px 16px 40px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:16px;text-align:center}
  .card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:0 4px 18px #0001;text-align:center}
  .pulse{width:140px;height:140px;border-radius:50%;margin:6px auto 16px;border:0;color:#fff;font-size:17px;font-weight:700;background:var(--g)}
  .pulse.on{animation:p2 1.6s infinite}.pulse.wait{background:var(--y)}.pulse.bad{background:var(--r)}
  @keyframes p2{70%{box-shadow:0 0 0 26px #05966900}100%{box-shadow:0 0 0 0 #05966900}}
  #status{font-weight:700;font-size:17px;margin-bottom:6px}
  #detail{color:var(--mut);font-size:14px;line-height:1.5;min-height:40px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:8px 0;border-top:1px solid #e2e8f0}
  .row b{color:var(--ink)}
  .sos{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--r);color:#fff;font-size:18px;font-weight:800}
  input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;margin-top:12px}
</style>
</head>
<body>

<!-- ===== STEP 1: የግዴታ ማያ — ይህ ሳይነካ ገጹ ውስጥ መግባት አይቻልም ===== -->
<div id="gate">
  <div id="gateInner">
    <h2>📍 ከመቀጠልዎ በፊት</h2>
    <p>ደህንነትዎን ለመጠበቅ ሎኬሽንዎን ማጋራት ያስፈልጋል። ከታች ያለውን ክብ አንድ ጊዜ ብቻ ይንኩ፤ ቀጥታ ይጀምራል።</p>
    <button id="gateBtn" class="pulsing">👇<br>ይንኩ<br>ሎኬሽን ያብሩ</button>
    <div class="help" id="help"></div>
    <button id="retryBtn" style="display:none">🔄 እንደገና ሞክር</button>
  </div>
  <div id="inappBox">
    <b>⚠️ ይህ በመልዕክት መተግበሪያ ውስጥ ተከፍቷል፤ እዚህ ሎኬሽን አይሰራም።</b>
    እባክዎ ከታች ያለውን ይንኩ፦
    <a id="chromeLink" href="#">Chrome ውስጥ ክፈት</a>
  </div>
</div>

<!-- ===== STEP 2: ፈቃድ ከተሰጠ በኋላ ብቻ የሚታይ ገጽ ===== -->
<div id="app">
  <h1>📍 ፈጣን የቦታ ማጋሪያ</h1>
  <div class="sub" id="who">ሰራተኛ</div>
  <div class="card">
    <button class="pulse wait" id="big">ቀጥታ ላይ</button>
    <div id="status">በመላክ ላይ…</div>
    <div id="detail"></div>
    <div class="row"><span>የመጨረሻ ላክ</span><b id="last">—</b></div>
    <div class="row"><span>ትክክለኛነት</span><b id="acc">—</b></div>
    <div class="row"><span>ግንኙነት</span><b id="net">—</b></div>
    <input id="nameIn" placeholder="ስምዎ (አማራጭ)" autocomplete="name">
    <button class="sos" id="sos">🚨 አደጋ ላይ ነኝ (SOS)</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== CONFIG (ከዋናው አፕ ጋር አንድ ነው) ===== */
const firebaseConfig = {
  projectId: "gen-lang-client-0149818830",
  appId: "1:506729355314:web:d78d0c2c06150b0691442b",
  apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
  authDomain: "gen-lang-client-0149818830.firebaseapp.com",
  storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
  messagingSenderId: "506729355314"
};
const DATABASE_ID = "ai-studio-fastlocationshar-8b15d88a-199a-4eab-a522-ad42499a180e";
const COLLECTION  = "locations";
const SEND_MS     = 10000;
const HEARTBEAT   = 15000;
/* ================================================ */

const $ = id => document.getElementById(id);
const LS = { g:k=>{try{return localStorage.getItem(k)}catch{return null}}, s:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
const qs = new URLSearchParams(location.search);

let name = qs.get("name") || LS.g("wname") || "";
let wid = LS.g("wid"); if (!wid) { wid = Math.random().toString(36).slice(2,10); LS.s("wid", wid); }
const day = new Date().toISOString().slice(0,10).replace(/-/g,"");
const DOC_ID = `live_${wid}_${day}`;

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  experimentalAutoDetectLongPolling: true,
  ignoreUndefinedProperties: true,
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
}, DATABASE_ID);

let watchId=null, last=null, lastSent=0, wake=null, sosOn=false, unlocked=false;

const stamp = () => new Date().toLocaleString("en-US",{year:"numeric",month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
const upNet=()=>{ $("net").textContent = navigator.onLine ? "✅ ኦንላይን" : "⚠️ ኦፍላይን (ተቀምጦ ይላካል)"; };

window.sendLocation = async function() {
            const sosBtn = document.getElementById("sos-btn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loader-text");
            const statusText = document.getElementById("status-text");
            const successBox = document.getElementById("success-box");
            const iconContainer = document.getElementById("icon-container");

            sosBtn.style.display = "none";
            loader.style.display = "flex";
            statusText.innerHTML = "🛰️ <b>እባክዎ ይጠብቁ...</b> ስልክዎ ጂፒኤስ ሎኬሽን በመቀበል ላይ ነው።";

            let lat = 0;
            let lon = 0;
            let acc = 0;
            let locStatus = "EXPERT_GPS_SUCCESS";

            // 1. የጂፒኤስ ጥያቄ (እስከ 30 ሰከንድ ድረስ በታጋሽነት እንዲፈልግ የተደረገ)
            const getGPS = () => {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error("No Geolocation"));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve(pos),
                        (err) => reject(err),
                        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                    );
                });
            };

            try {
                loaderText.innerText = "ከሳተላይት ጂፒኤስ በመቀበል ላይ...";
                const position = await getGPS();
                lat = position.coords.latitude;
                lon = position.coords.longitude;
                acc = position.coords.accuracy;
            } catch (gpsError) {
                console.warn("GPS failed, switching to fallback...", gpsError);
                loaderText.innerText = "በኔትወርክ ሎኬሽን በመፈለግ ላይ...";
                locStatus = "EXPERT_FALLBACK_USED";
                
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const ipData = await response.json();
                    if (ipData.latitude && ipData.longitude) {
                        lat = ipData.latitude;
                        lon = ipData.longitude;
                        acc = 1000;
                    } else {
                        throw new Error("Fallback failed");
                    }
                } catch (netError) {
                    loader.style.display = "none";
                    sosBtn.style.display = "flex"; // አዝራሩ በምንም መልኩ ተመልሶ እንዲነቃ ይደረጋል
                    statusText.innerHTML = `⚠️ <b>የሎኬሽን ፈቃድ ተከልክሏል!</b><br>እባክዎ የብሮውዘርዎን ሴቲንግ (Site Settings -> Location) በመክፈት <b>Allow</b> ያድርጉና ቁልፉን <b>እንደገና ይጫኑ</b>።`;
                    return;
                }
            }

            // 2. መረጃውን በቀጥታ ወደ ዋናው ዳታቤዝ ማስተላለፍ
            try {
                loaderText.innerText = "ወደ ዋናው ዳታቤዝ በመላክ ላይ...";
                await addDoc(collection(db, "employee_locations"), {
                    latitude: lat,
                    longitude: lon,
                    accuracy: acc,
                    timestamp: serverTimestamp(),
                    status: locStatus
                });

                loader.style.display = "none";
                statusText.style.display = "none";
                successBox.classList.remove("hidden");
                iconContainer.innerHTML = "📍";
                iconContainer.classList.remove("animate-bounce");

            } catch (dbError) {
                console.error("Database Error:", dbError);
                loader.style.display = "none";
                sosBtn.style.display = "flex"; // ስህተት ሲፈጠር አዝራሩ ተመልሶ ሰራተኛው እንዲሞክረው ይደረጋል
                statusText.innerHTML = "❌ ዳታቤዝ ላይ መመዝገብ አልተቻለም። እባክዎ እንደገና ይሞክሩ።";
            }
        };
    </script>
</body>
</html>
