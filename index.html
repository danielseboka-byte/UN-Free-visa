<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አስቸኳይ የሰራተኛ ሎኬሽን ማጋሪያ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-red-500/50 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
        <div id="icon-container" class="w-20 h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-bounce">
            🚨
        </div>
        
        <h1 class="text-2xl font-bold mb-2 text-red-400">አስቸኳይ እርዳታ ማግኛ</h1>
        <p id="status-text" class="text-slate-300 text-sm mb-8 leading-relaxed">
            በጫካ ውስጥ አደጋ ሲገጥምዎ ከታች ያለውን ቁልፍ በመጫን ሎኬሽንዎን ለአድሚን ወዲያውኑ ያጋሩ።
        </p>

        <!-- ሰራተኛው የሚጫነው ግዙፍ ቁልፍ -->
        <button id="sos-btn" onclick="sendLocation()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition-all text-white font-bold py-4 px-6 rounded-2xl shadow-lg text-lg flex items-center justify-center gap-2 mb-4 cursor-pointer">
            📍 ሎኬሽን ለአድሚን ላክ
        </button>

        <!-- ሎደር -->
        <div id="loader" class="hidden justify-center items-center mb-4">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent"></div>
            <span id="loader-text" class="ml-3 text-slate-300 text-sm">ጂፒኤስ ሎኬሽን በመፈለግ ላይ...</span>
        </div>

        <!-- ስኬታማ መልዕክት -->
        <div id="success-box" class="hidden bg-emerald-950 border border-emerald-500/50 p-4 rounded-xl text-emerald-200 text-sm">
            ✅ <b>ሎኬሽንዎ በተሳካ ሁኔታ ለአድሚን ተጋርቷል!</b> እርዳታ በቅርብ ሰዓት ይደርሶታል።
        </div>
    </div>

    <!-- Firebase SDK እና የላቀ ሮበስት ሎኬሽን መላኪያ ኮድ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";        
        // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
  "projectId": "gen-lang-client-0149818830",
  "appId": "1:506729355314:web:d78d0c2c06150b0691442b",
  "apiKey": "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
  "authDomain": "gen-lang-client-0149818830.firebaseapp.com",
  "firestoreDatabaseId": "ai-studio-fastlocationshar-8b15d88a-199a-4eab-a522-ad42499a180e",
  "storageBucket": "gen-lang-client-0149818830.firebasestorage.app",
  "messagingSenderId": "506729355314",
  "measurementId": "",
  "oAuthClientId": "506729355314-0uuujeltdcuek2ecofdt53nlpob26nlf.apps.googleusercontent.com",
  "recaptchaSiteKey": ""
}
 
     const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendLocation = async function() {
            const sosBtn = document.getElementById("sos-btn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loader-text");
            const statusText = document.getElementById("status-text");
            const successBox = document.getElementById("success-box");
            const iconContainer = document.getElementById("icon-container");

            sosBtn.style.display = "none";
            loader.style.display = "flex";
            statusText.innerHTML = "🛰️ <b>እባክዎ ይጠብቁ...</b> ሎኬሽን በመቀበል ላይ ነው።";

            let lat = 0;
            let lon = 0;
            let acc = 0;
            let locStatus = "GPS_SUCCESS";

            // 1. የጂፒኤስ ጥያቄ (ጊዜውን ወደ 30 ሰከንድ ከፍ አድርገነዋል)
            const getGPS = () => {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error("No Geolocation"));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve(pos),
                        (err) => reject(err),
                        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                    );
                });
            };

            try {
                loaderText.innerText = "ከሳተላይት ጂፒኤስ በመቀበል ላይ...";
                const position = await getGPS();
                lat = position.coords.latitude;
                lon = position.coords.longitude;
                acc = position.coords.accuracy;
            } catch (gpsError) {
                console.warn("GPS failed or timed out, switching to Network Fallback...", gpsError);
                loaderText.innerText = "በኔትወርክ ሎኬሽን በመፈለግ ላይ...";
                locStatus = "NETWORK_FALLBACK_USED";
                
                // 2. ጂፒኤስ ዘግይቶ ከጠፋ ወይም ብሮውዘሩ ካገደው በ Network/IP አማካኝነት መረጃውን ማግኘት
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const ipData = await response.json();
                    if (ipData.latitude && ipData.longitude) {
                        lat = ipData.latitude;
                        lon = ipData.longitude;
                        acc = 1000;
                    } else {
                        throw new Error("Network location failed");
                    }
                } catch (netError) {
                    loader.style.display = "none";
                    sosBtn.style.display = "flex";
                    statusText.innerHTML = `⚠️ <b>የሎኬሽን ፈቃድ ተከልክሏል!</b><br>እባክዎ የብሮውዘርዎን ሴቲንግ (Site Settings -> Location) በመክፈት <b>Allow</b> ያድርጉና ቁልፉን <b>እንደገና ይጫኑ</b>።`;
                    return;
                }
            }

            // 3. መረጃውን ወደ ፋየርቤዝ በሰኮንዶች ውስጥ መላክ
            try {
                loaderText.innerText = "ወደ ዳታቤዝ በመላክ ላይ...";
                await addDoc(collection(db, "employee_locations"), {
                    latitude: lat,
                    longitude: lon,
                    accuracy: acc,
                    timestamp: serverTimestamp(),
                    status: locStatus
                });

                loader.style.display = "none";
                statusText.style.display = "none";
                successBox.classList.remove("hidden");
                iconContainer.innerHTML = "📍";
                iconContainer.classList.remove("animate-bounce");

            } catch (dbError) {
                console.error("Database Error:", dbError);
                loader.style.display = "none";
                sosBtn.style.display = "flex";
                statusText.innerHTML = "❌ ዳታቤዝ ላይ መመዝገብ አልተቻለም። እባክዎ እንደገና ይሞክሩ።";
            }
        };
    </script>
</body>
</html>
                statusText.innerHTML = "❌ ዳታቤዝ ላይ መመዝገብ አልተቻለም። እባክዎ እንደገና ይሞክሩ።";
            }
        };
    </script>
</body>
</html>
