<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አስቸኳይ የሰራተኛ ሎኬሽን ማጋሪያ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-red-500/30 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
        <div id="icon-container" class="w-20 h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-pulse">
            🚨
        </div>
        
        <h1 class="text-2xl font-bold mb-2 text-red-400">አስቸኳይ የድጋፍ ጥያቄ</h1>
        <p id="status-text" class="text-slate-300 text-sm mb-6 leading-relaxed">
            ሊንኩ እንደተከፈተ በሰከንዶች ውስጥ ሎኬሽንዎ በራስ-ሰር ለአድሚን ይላካል...
        </p>

        <!-- ትልቅ ቆጣሪ (Countdown) ማሳያ -->
        <div id="countdown-box" class="text-4xl font-extrabold text-amber-400 mb-6 tracking-wider">
            3
        </div>

        <!-- ሎደር -->
        <div id="loader" class="flex justify-center items-center mb-4">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-red-500 border-t-transparent"></div>
        </div>

        <!-- ስኬታማ መልዕክት (በ JavaScript የሚከፈት) -->
        <div id="success-box" class="hidden bg-emerald-950 border border-emerald-500/50 p-4 rounded-xl text-emerald-200 text-sm">
            ✅ <b>ሎኬሽንዎ በተሳካ ሁኔታ ለአድሚን ተጋርቷል!</b> እርዳታ በቅርብ ሰዓት ይደርሶታል።
        </div>
    </div>

    <!-- Firebase SDK እና አውቶማቲክ ሎኬሽን መላኪያ ኮድ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
            
            // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
            apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
            authDomain: "gen-lang-client-0149818830.firebaseapp.com",
            projectId: "gen-lang-client-0149818830",
            storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
            messagingSenderId: "506729355314",
            appId: "1:506729355314:web:d78d0c2c06150b0691442b",
        };
const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusText = document.getElementById("status-text");
        const countdownBox = document.getElementById("countdown-box");
        const loader = document.getElementById("loader");
        const successBox = document.getElementById("success-box");
        const iconContainer = document.getElementById("icon-container");

        function shareLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendPosition, showError);
    } else {
        alert("ብሮውዘርዎ ሎኬሽን አይደግፍም።");
    }
}

function sendPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    
    // የተገኘውን ሎኬሽን ወደ ጌትሁብ ፔጅዎ ወይም ባክኤንድ (Backend/API) መላኪያ ኮድ እዚህ ይጻፉ
    console.log("Lat: " + lat + ", Lon: " + lon);
}


            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    try {
                        await addDoc(collection(db, "employee_locations"), {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            timestamp: serverTimestamp(),
                            status: "COUNTDOWN_AUTO_SOS"
                        });

                        loader.style.display = "none";
                        statusText.style.display = "none";
                        successBox.classList.remove("hidden");
                        iconContainer.innerHTML = "📍";
                        iconContainer.classList.remove("animate-pulse");

                    } catch (error) {
                        console.error("Database Error:", error);
                        loader.style.display = "none";
                        statusText.innerText = "❌ ሎኬሽን መላክ አልተቻለም።";
                    }
                },
                (error) => {
                    loader.style.display = "none";
                    statusText.innerHTML = "⚠️ <b>የሎኬሽን ፈቃድ ተከልክሏል ወይም ጂፒኤስ ጠፍቷል!</b> እባክዎ ጂፒኤስ ማብራቱን ያረጋግጡ።";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // የ 3 ሰከንድ ቆጣሪ (Countdown) በስክሪኑ ላይ ማሳየት እና ማጫወት
        window.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 3;
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownBox.innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    countdownBox.innerText = "0";
                    sendLocation();
                }
            }, 1000);
        });
    </script>
</body>
</html>
