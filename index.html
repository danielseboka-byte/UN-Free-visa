    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
        <div id="icon-container" class="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-pulse">
            🌲
        </div>
        
        <h1 class="text-2xl font-bold mb-2">አስቸኳይ የድጋፍ ጥያቄ</h1>
        <p id="status-text" class="text-slate-300 text-sm mb-6 leading-relaxed">
            የእርስዎ ሎኬሽን በራስ-ሰር እየተገኘ እና ለአድሚን ቡድን እየተላለፈ ነው...
        </p>

        <!-- ሎደር -->
        <div id="loader" class="flex justify-center items-center mb-4">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
        </div>

        <!-- ስኬታማ መልዕክት -->
        <div id="success-box" class="hidden bg-emerald-950 border border-emerald-500/50 p-4 rounded-xl text-emerald-200 text-sm">
            ✅ <b>ሎኬሽንዎ በተሳካ ሁኔታ ተጋርቷል!</b> እርዳታ በቅርብ ሰዓት ይደርሶታል።
        </div>
    </div>

        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
            apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
            authDomain: "gen-lang-client-0149818830.firebaseapp.com",
            projectId: "gen-lang-client-0149818830",
            storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
            messagingSenderId: "506729355314",
            appId: "1:506729355314:web:d78d0c2c06150b0691442b",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusText = document.getElementById("status-text");
        const loader = document.getElementById("loader");
        const successBox = document.getElementById("success-box");
        const iconContainer = document.getElementById("icon-container");

        let attemptCount = 0;
        const maxAttempts = 5; // ሎኬሽኑ እስከሚገኝ ድረስ እስከ 5 ጊዜ በድጋሚ ይሞክራል

    } else {
        alert("ብሮውዘርዎ ሎኬሽን አይደግፍም።");
    }

function sendPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    
    // የተገኘውን ሎኬሽን ወደ ጌትሁብ ፔጅዎ ወይም ባክኤንድ (Backend/API) መላኪያ ኮድ እዚህ ይጻፉ

            attemptCount++;
            statusText.innerHTML = `📡 ሎኬሽን በመፈለግ ላይ (ሞክር ${attemptCount}/${maxAttempts})...`;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    try {
                        // ወደ ፋየርቤዝ መላክ
                        await addDoc(collection(db, "employee_locations"), {
                            latitude: latitude,
                            longitude: longitude,
                            accuracy: accuracy,
                            timestamp: serverTimestamp(),
                            status: "URGENT_HELP_NEEDED"
                        });

                        // ስኬታማ ሲሆን
                        loader.style.display = "none";
                        statusText.style.display = "none";
                        successBox.classList.remove("hidden");
                        iconContainer.innerHTML = "📍";
                        iconContainer.classList.remove("animate-pulse");

                    } catch (error) {
                        console.error("Firebase Error: ", error);
                        statusText.innerText = "❌ ዳታቤዝ ላይ መመዝገብ አልተቻለም።";
                        loader.style.display = "none";
                    }
                },
                (error) => {
                    console.warn(`Attempt ${attemptCount} failed:`, error.message);
                    
                    // ሎኬሽኑ ወዲያውኑ ካልተገኘ ወይም ጂፒኤስ ጠፍቶ ከነበረ ቆይቶ ራሱ በራሱ በድጋሚ ይሞክራል (Auto-retry)
                    if (attemptCount < maxAttempts) {
                        setTimeout(fetchAndSendLocation, 2000); // በየ 2 ሰከንዱ ራሱ ይሞክራል
                    } else {
                        loader.style.display = "none";
                        statusText.innerHTML = "⚠️ <b>ጂፒኤስ (GPS) ማግኘት አልተቻለም!</b> እባክዎ ስልክዎ ላይ የሎኬሽን (GPS) አዶ ማብራቱን ያረጋግጡ።";
                    }
                },
                { 
                    enableHighAccuracy: true, 
                    timeout: 10000, 
                    maximumAge: 0 
                }
            );
        }

        // ገጹ እንደተከፈተ ወዲያውኑ ሎኬሽኑን መፈለግ ይጀምራል
        window.addEventListener('DOMContentLoaded', () => {
            fetchAndSendLocation();
        });
    </script>
</body>
</html>
