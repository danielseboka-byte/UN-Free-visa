<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>ፈጣን የቦታ ማጋሪያ</title>
<style>
  :root{--g:#059669;--r:#dc2626;--y:#d97706;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,"Noto Sans Ethiopic",sans-serif;background:var(--bg);color:var(--ink)}

  /* ===== የግዴታ ማያ (gate) ===== */
  #gate{position:fixed;inset:0;background:var(--g);color:#fff;display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:24px;text-align:center;z-index:999}
  #gate.bad{background:var(--r)}
  #gate h2{font-size:22px;margin:0 0 10px}
  #gate p{font-size:15px;opacity:.95;line-height:1.6;max-width:360px;margin:0 0 26px}
  #gateBtn{width:220px;height:220px;border-radius:50%;border:0;background:#fff;color:var(--g);
           font-size:22px;font-weight:800;box-shadow:0 0 0 0 #ffffff66;cursor:pointer}
  #gateBtn.pulsing{animation:p 1.6s infinite}
  @keyframes p{70%{box-shadow:0 0 0 30px #ffffff00}100%{box-shadow:0 0 0 0 #ffffff00}}
  .help{display:none;text-align:left;background:#fff2;border-radius:12px;padding:14px;font-size:13.5px;
        line-height:1.7;margin-top:18px;max-width:360px}
  .help b{display:block;margin-bottom:4px}
  #retryBtn{margin-top:16px;padding:12px 22px;border:0;border-radius:12px;background:#fff;color:var(--r);
            font-weight:800;font-size:15px}
  #inappBox{display:none;background:#fff2;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.7;max-width:360px;margin-top:10px}
  #inappBox a{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:10px;background:#fff;color:var(--r);font-weight:800;text-decoration:none}

  /* ===== ዋና ገጽ ===== */
  #app{display:none;min-height:100%;flex-direction:column;align-items:center;padding:20px 16px 40px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:16px;text-align:center}
  .card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:0 4px 18px #0001;text-align:center}
  .pulse{width:140px;height:140px;border-radius:50%;margin:6px auto 16px;border:0;color:#fff;font-size:17px;font-weight:700;background:var(--g)}
  .pulse.on{animation:p2 1.6s infinite}.pulse.wait{background:var(--y)}.pulse.bad{background:var(--r)}
  @keyframes p2{70%{box-shadow:0 0 0 26px #05966900}100%{box-shadow:0 0 0 0 #05966900}}
  #status{font-weight:700;font-size:17px;margin-bottom:6px}
  #detail{color:var(--mut);font-size:14px;line-height:1.5;min-height:40px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:8px 0;border-top:1px solid #e2e8f0}
  .row b{color:var(--ink)}
  .sos{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--r);color:#fff;font-size:18px;font-weight:800}
  input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;margin-top:12px}
</style>
</head>
<body>

<!-- ===== STEP 1: የግዴታ ማያ — ይህ ሳይነካ ገጹ ውስጥ መግባት አይቻልም ===== -->
<div id="gate">
  <div id="gateInner">
    <h2>📍 ከመቀጠልዎ በፊት</h2>
    <p>ደህንነትዎን ለመጠበቅ ሎኬሽንዎን ማጋራት ያስፈልጋል። ከታች ያለውን ክብ አንድ ጊዜ ብቻ ይንኩ፤ ቀጥታ ይጀምራል።</p>
    <button id="gateBtn" class="pulsing">👇<br>ይንኩ<br>ሎኬሽን ያብሩ</button>
    <div class="help" id="help"></div>
    <button id="retryBtn" style="display:none">🔄 እንደገና ሞክር</button>
  </div>
  <div id="inappBox">
    <b>⚠️ ይህ በመልዕክት መተግበሪያ ውስጥ ተከፍቷል፤ እዚህ ሎኬሽን አይሰራም።</b>
    እባክዎ ከታች ያለውን ይንኩ፦
    <a id="chromeLink" href="#">Chrome ውስጥ ክፈት</a>
  </div>
</div>

<!-- ===== STEP 2: ፈቃድ ከተሰጠ በኋላ ብቻ የሚታይ ገጽ ===== -->
<div id="app">
  <h1>📍 ፈጣን የቦታ ማጋሪያ</h1>
  <div class="sub" id="who">ሰራተኛ</div>
  <div class="card">
    <button class="pulse wait" id="big">ቀጥታ ላይ</button>
    <div id="status">በመላክ ላይ…</div>
    <div id="detail"></div>
    <div class="row"><span>የመጨረሻ ላክ</span><b id="last">—</b></div>
    <div class="row"><span>ትክክለኛነት</span><b id="acc">—</b></div>
    <div class="row"><span>ግንኙነት</span><b id="net">—</b></div>
    <input id="nameIn" placeholder="ስምዎ (አማራጭ)" autocomplete="name">
    <button class="sos" id="sos">🚨 አደጋ ላይ ነኝ (SOS)</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== CONFIG (ከዋናው አፕ ጋር አንድ ነው) ===== */
const firebaseConfig = {
  projectId: "gen-lang-client-0149818830",
  appId: "1:506729355314:web:d78d0c2c06150b0691442b",
  apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
  authDomain: "gen-lang-client-0149818830.firebaseapp.com",
  storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
  messagingSenderId: "506729355314"
};
const DATABASE_ID = "ai-studio-fastlocationshar-8b15d88a-199a-4eab-a522-ad42499a180e";
const COLLECTION  = "locations";
const SEND_MS     = 10000;
const HEARTBEAT   = 15000;
/* ================================================ */

const $ = id => document.getElementById(id);
const LS = { g:k=>{try{return localStorage.getItem(k)}catch{return null}}, s:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
const qs = new URLSearchParams(location.search);

let name = qs.get("name") || LS.g("wname") || "";
let wid = LS.g("wid"); if (!wid) { wid = Math.random().toString(36).slice(2,10); LS.s("wid", wid); }
const day = new Date().toISOString().slice(0,10).replace(/-/g,"");
const DOC_ID = `live_${wid}_${day}`;

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  experimentalAutoDetectLongPolling: true,
  ignoreUndefinedProperties: true,
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
}, DATABASE_ID);

let watchId=null, last=null, lastSent=0, wake=null, sosOn=false, unlocked=false;

const stamp = () => new Date().toLocaleString("en-US",{year:"numeric",month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
const upNet=()=>{ $("net").textContent = navigator.onLine ? "✅ ኦንላይን" : "⚠️ ኦፍላይን (ተቀምጦ ይላካል)"; };

function payload(lat, lon, acc){
  return {
    employeeName: (sosOn ? "🚨 SOS - " : "") + (name || "Anonymous Employee"),
    lat, lon,
    timestamp: stamp(),
    mapUrl: `https://www.google.com/maps?q=${lat},${lon}`,
    createdAt: new Date().toISOString(),
    accuracy: acc ?? null,
    sos: sosOn,
    workerId: wid
  };
}
async function send(lat, lon, acc, force){
  const now=Date.now();
  if(!force && now-lastSent < SEND_MS) return;
  lastSent=now;
  try{
    await setDoc(doc(db, COLLECTION, DOC_ID), payload(lat,lon,acc), { merge:true });
    $("last").textContent = new Date().toLocaleTimeString();
    $("acc").textContent = acc ? Math.round(acc)+" ሜ" : "—";
  }catch(e){ console.error(e); $("detail").textContent="መላክ አልተሳካም፤ እንደገና ይሞክራል… ("+(e.code||e.message)+")"; }
}

function onPos(p){
  last={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
  $("big").className="pulse on"; $("big").textContent="ቀጥታ ላይ";
  $("status").textContent="✅ ሎኬሽን እየተጋራ ነው";
  $("detail").textContent="ገጹን ክፍት ያድርጉ። ከወጡ ተመልሰው ሲገቡ ራሱ ይቀጥላል።";
  send(last.lat,last.lon,last.acc,false);
}
function onErr(e){
  $("big").className="pulse wait"; $("status").textContent="⏳ GPS እየፈለገ ነው…";
  $("detail").textContent="ክፍት ቦታ ይሂዱ፤ ራሱ ይቀጥላል።";
}
function startWatch(){
  if(!navigator.geolocation) return;
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  wakeLock();
}
async function wakeLock(){ try{ if("wakeLock" in navigator && !wake){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>wake=null);} }catch{} }

setInterval(()=>{ if(unlocked && last) send(last.lat,last.lon,last.acc,true); }, HEARTBEAT);
document.addEventListener("visibilitychange",()=>{ if(unlocked && document.visibilityState==="visible"){ upNet(); startWatch(); } });
window.addEventListener("pageshow",()=>{ if(unlocked){ upNet(); startWatch(); } });
window.addEventListener("focus",()=>{ if(unlocked){ upNet(); startWatch(); } });
window.addEventListener("online",()=>{ upNet(); if(unlocked){ startWatch(); if(last) send(last.lat,last.lon,last.acc,true); } });
window.addEventListener("offline",upNet);

$("nameIn").addEventListener("change", e => { name=e.target.value.trim(); LS.s("wname",name); $("who").textContent="ሰራተኛ: "+(name||"ስም አልተሰጠም"); });

$("sos").addEventListener("click", async ()=>{
  sosOn=true;
  $("detail").textContent="🚨 የአደጋ ጥሪ እየተላከ ነው…";
  const finishSos = async (lat,lon,acc)=>{
    try{
      await addDoc(collection(db, COLLECTION), payload(lat,lon,acc));
      await send(lat,lon,acc,true);
      alert("🚨 የአደጋ ጥሪ ተልኳል።");
    }catch(e){ alert("ጥሪው ተቀምጧል፤ ኔትወርክ ሲመለስ ይላካል።"); }
  };
  if(last){ finishSos(last.lat,last.lon,last.acc); }
  else {
    navigator.geolocation.getCurrentPosition(
      p=>finishSos(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
      ()=>{ alert("⚠️ ቦታ ገና አልተገኘም። ትንሽ ይጠብቁና እንደገና ይሞክሩ፣ ወይም ወደ ክፍት ቦታ ይሂዱ።"); },
      {enableHighAccuracy:true, timeout:10000}
    );
  }
});

/* ===== In-app browser detection (Telegram/FB/IG ወዘተ) ===== */
const ua=navigator.userAgent;
const inApp = /FBAN|FBAV|Instagram|Telegram|Line\/|Snapchat|TikTok|; wv\)/i.test(ua) && /Android/i.test(ua);
if(inApp){
  $("inappBox").style.display="block";
  $("gateInner").style.display="none";
  $("chromeLink").href = "intent://"+location.host+location.pathname+location.search+"#Intent;scheme=https;package=com.android.chrome;end";
}

/* =========================================================
   STEP 1: GATE
   ፈቃድ ቀድሞ "granted" ከሆነ (ቀድሞ አንድ ጊዜ ተፈቅዶ ከሆነ)፣ ምንም ንክኪ ሳያስፈልግ
   በገጽ መክፈቻው ቅጽበት ራሱ በራስ-ሰር ይጀምራል — ይህ ነው ለድንገተኛ ጊዜ የሚያስፈልገው እውነተኛ "አንድ ጊዜ ብቻ" ተሞክሮ።
   ፈቃድ ገና "prompt" ወይም "denied" ከሆነ ብቻ የግዴታ ክብ ይታያል (የመጀመሪያ ማዋቀሪያ፣ አንድ ጊዜ ብቻ)።
   ========================================================= */
function openApp(){
  unlocked = true;
  $("gate").style.display="none";
  $("app").style.display="flex";
  $("who").textContent="ሰራተኛ: "+(name||"ስም አልተሰጠም");
  $("nameIn").value = name;
  upNet();
  startWatch();
}
function onGateSuccess(p){
  onPos(p);
  openApp();
}

async function tryAutoStart(){
  if(inApp) return false; // in-app browser ውስጥ ሁልጊዜ ሊንክ መቀየሪያ ያስፈልጋል
  try{
    if(!navigator.permissions || !navigator.permissions.query) return false;
    const status = await navigator.permissions.query({name:"geolocation"});
    if(status.state === "granted"){
      // ፈቃድ ቀድሞ ተሰጥቷል → ምንም ንክኪ ሳያስፈልግ ወዲያውኑ ጀምር
      navigator.geolocation.getCurrentPosition(onGateSuccess, onGateError, {enableHighAccuracy:true, timeout:15000});
      return true;
    }
  }catch(e){ /* Permissions API ያልተደገፈ ከሆነ ወደ መደበኛ ክብ ንክኪ እንመለሳለን */ }
  return false;
}
tryAutoStart();
function onGateError(err){
  $("gateBtn").classList.remove("pulsing");
  $("gateBtn").textContent = "🔄 እንደገና ይንኩ";
  $("gate").classList.add("bad");
  const h = $("help");
  h.style.display="block";
  const dbg = `<div style="margin-top:10px;font-size:11px;opacity:.75;direction:ltr">debug: code=${err.code} "${err.message||''}"</div>`;
  if(err.code===1){
    h.innerHTML = "<b>❌ ሎኬሽን ተከልክሏል (ቀድሞ የተደረገ እገዳ)።</b>Chrome ላይ ድጋሚ ቢነኩትም ራሱ አይጠይቅም፤ መጀመሪያ እግዱን ማጽዳት አለብዎት፦<br>1. ከአድራሻ አሞሌው ግራ 🔒 ይንኩ<br>2. «Permissions» → «Location» → <b>Allow</b> (ወይም «Reset permissions»)<br>3. ገጹን ዝግተው እንደገና ይክፈቱ።<br>በስልኩ ቅንብርም GPS መብራቱን ያረጋግጡ።" + dbg;
  } else if(err.code===3){
    h.innerHTML = "<b>⏳ ጊዜው አልቀ (timeout)።</b>GPS ምልክት ማግኘት አልተቻለም። ወደ መስኮት/ክፍት ቦታ ይጠጉና እንደገና ይንኩ።" + dbg;
  } else {
    h.innerHTML = "<b>⚠️ ቦታ ማግኘት አልተቻለም።</b>GPS ያብሩና እንደገና ይሞክሩ።" + dbg;
  }
}
$("gateBtn").addEventListener("click", function(){
  if(!navigator.geolocation){ onGateError({code:2}); return; }
  // ይህ ጥሪ በቀጥታ በንክኪው ውስጥ ነው የሚላከው — Chrome ፈቃድ prompt በትክክል እንዲያሳይ ይህ ወሳኝ ነው
  navigator.geolocation.getCurrentPosition(onGateSuccess, onGateError, {enableHighAccuracy:true, timeout:15000});
});
</script>
</body>
</html>
