<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";            // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
            apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
            authDomain: "gen-lang-client-0149818830.firebaseapp.com",
            projectId: "gen-lang-client-0149818830",
            storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
            messagingSenderId: "506729355314",
            appId: "1:506729355314:web:d78d0c2c06150b0691442b",
        };
 const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ሊንኩ እንደተከፈተ ራሱ በራሱ ሎኬሽን ፈልጎ ወደ ዳታቤዝ የሚልከው ዋናው ስክሪፕት
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            try {
                                await addDoc(collection(db, "employee_locations"), {
                                    latitude: position.coords.latitude,
                                    longitude: position.coords.longitude,
                                    timestamp: serverTimestamp(),
                                    status: "AUTO_SOS"
                                });
                                document.body.innerHTML = `
                                    <div style="background:#022c22; color:#a7f3d0; padding:30px; text-align:center; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                                        <h1 style="font-size:24px; margin-bottom:10px;">✅ ሎኬሽንዎ ተጋርቷል!</h1>
                                        <p>እርዳታ በቅርብ ሰዓት ይደርሶታል።</p>
                                    </div>
                                `;
                            } catch (e) {
                                console.error(e);
                            }
                        },
                        (error) => {
                            console.error(error);
                        },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                }
            }, 1000);
        });
    </script>
