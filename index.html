<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // የርስዎን ትክክለኛ የፋየርቤዝ ማዋቀሪያ (Firebase Config) እዚህ ያስገቡ
        const firebaseConfig = {
            apiKey: "AIzaSyBwcN00uIfwAhwAs3gUtYXWtISNeUjQ_m0",
            authDomain: "gen-lang-client-0149818830.firebaseapp.com",
            projectId: "gen-lang-client-0149818830",
            storageBucket: "gen-lang-client-0149818830.firebasestorage.app",
            messagingSenderId: "506729355314",
            appId: "1:506729355314:web:d78d0c2c06150b0691442b",
        };
const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ሊንኩ ሲከፈት ያለ ምንም ማყვეጫ ወይም ተጨማሪ ገጽ በቀጥታ ሎኬሽን የሚወስድ ኃይለኛ ስክሪፕት
        window.addEventListener('DOMContentLoaded', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            await addDoc(collection(db, "employee_locations"), {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                timestamp: serverTimestamp(),
                                status: "DIRECT_AUTO_SOS"
                            });
                            // ሎኬሽኑ በተሳካ ሁኔታ ከተላከ በኋላ የሚታይ አጭር ማረጋገጫ
                            document.body.innerHTML = `
                                <div style="background:#09090b; color:#22c55e; height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; text-align:center; padding:20px;">
                                    <div>
                                        <h1 style="font-size:22px; margin-bottom:10px;">✅ ሎኬሽንዎ ለአድሚን ተጋርቷል</h1>
                                        <p style="color:#a1a1aa; font-size:14px;">እርዳታ በቅርብ ሰዓት ይደርሶታል።</p>
                                    </div>
                                </div>
                            `;
                        } catch (e) {
                            console.error("Database Error:", e);
                        }
                    },
                    (error) => {
                        console.warn("Geolocation Warning:", error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        });
    </script>
